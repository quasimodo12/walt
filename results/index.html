<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WALT Results</title>

    <!-- External CSS Libraries -->
    <!-- jQuery UI CSS for UI components -->
    <link rel="stylesheet" href="vendor/jquery/jquery-ui.css">

    <!-- DataTables CSS for enhanced table features -->
    <link rel="stylesheet" href="vendor/datatables/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="vendor/datatables/jquery.dataTables.min.css">

    <!-- Tabulator CSS for interactive tables -->
    <link rel="stylesheet" href="vendor/tabulator/tabulator.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/res_styles.css">
    <link rel="stylesheet" href="css/table_styles.css">

    <!-- External JavaScript Libraries -->
    <!-- jQuery Library -->
    <script src="vendor/jquery/jquery.min.js"></script>

    <!-- jQuery UI JS for interactive UI components -->
    <script src="vendor/jquery/jquery-ui.js"></script>

    <!-- DataTables JS for enhanced table functionalities -->
    <script src="vendor/datatables/jquery.dataTables.min.js"></script>
    <script src="vendor/datatables/dataTables.min.js"></script>

    <!-- Tabulator JS for interactive tables -->
    <script src="vendor/tabulator/tabulator.min.js"></script>

    <!-- Chart.js for charting functionalities -->
    <script src="vendor/chart/chart.js"></script>

    <!-- Custom JavaScript Libraries -->
    <!-- Custom Bar Chart Implementation -->
    <script src="js/components/CustomBarChart.js"></script>

    <!-- Pie Chart Table Script -->
    <script src="js/components/PieChartTable.js"></script>

    <!-- Custom Bar Chart Table Script -->
    <script src="js/components/CustomBarChartTable.js"></script>

    <!-- Eruda for debugging (visible only on mobile devices) -->
    <script src="vendor/eruda/eruda.min.js"></script>
    <script>
        // Initialize Eruda for debugging
        eruda.init();
    </script>

    <script src="js/shared/side_config.js"></script>
    <script src="js/shared/range_utils.js"></script>
    <!-- Custom JavaScript Files -->
    <script src="js/globals.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/legend.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/config.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/ui.js"></script>
</head>
<body>
    <!-- Configuration Controls -->
    <div id="results-control-buttons">
        <!-- Button to open the configuration dialog -->
        <button id="open-config-button">Configure Display</button>

        <!-- Button to open the chart color configuration dialog -->
        <button id="open-colors-button">Configure Colors</button>
    </div>

    <!-- Configuration Dialog -->
    <div id="config-dialog" style="display: none;">
        <div id="config-panel">
            <table>
                <!-- Chart Type Selection -->
                <tr>
                    <th>Chart Type</th>
                    <td colspan="2">
                        <select id="chart-type">
                            <option value="Pie" selected>Pie</option>
                            <option value="Loadouts" selected>Loadouts</option>
                        </select>
                    </td>
                </tr>
                <!-- Side Selection -->
                <tr>
                    <th>Side</th>
                    <td colspan="2">
                        <select id="side"></select>
                    </td>
                </tr>
                <!-- Friendly Platforms and Groups -->
                <tr>
                    <th>Friendly Platforms</th>
                    <th>Friendly Groups</th>
                </tr>
                <tr>
                    <td>
                        <select id="friendly-platforms" multiple></select>
                    </td>
                    <td>
                        <select id="friendly-groups" multiple></select>
                    </td>
                </tr>
                <!-- Enemy Platforms and Groups -->
                <tr>
                    <th>Enemy Platforms</th>
                    <th>Enemy Groups</th>
                </tr>
                <tr>
                    <td>
                        <select id="enemy-platforms" multiple></select>
                    </td>
                    <td>
                        <select id="enemy-groups" multiple></select>
                    </td>
                </tr>
                <!-- Weapons and Sensors Selection -->
                <tr>
                    <th>Weapons</th>
                    <th>Sensors</th>
                </tr>
                <tr>
                    <td>
                        <select id="weapons" multiple></select>
                    </td>
                    <td>
                        <select id="sensors" multiple></select>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <!-- Chart Color Configuration Dialog -->
    <div id="color-config-dialog" style="display: none;">
        <div id="color-config-panel">
            <p id="color-config-description"></p>

            <div id="pie-color-options" class="color-options-panel">
                <div class="color-option-row">
                    <label for="pie-in-range-color">Colored pie portion</label>
                    <input type="color" id="pie-in-range-color">
                    <span class="color-preview" data-preview-for="pie-in-range-color"></span>
                    <span class="color-hex-value" data-hex-for="pie-in-range-color"></span>
                </div>
                <div class="color-option-row">
                    <label for="pie-out-of-range-color">Uncolored pie portion</label>
                    <input type="color" id="pie-out-of-range-color">
                    <span class="color-preview" data-preview-for="pie-out-of-range-color"></span>
                    <span class="color-hex-value" data-hex-for="pie-out-of-range-color"></span>
                </div>
            </div>

            <div id="loadout-color-options" class="color-options-panel">
                <div class="color-option-row">
                    <label for="loadout-platform-count-color">Number of platforms in the group</label>
                    <input type="color" id="loadout-platform-count-color">
                    <span class="color-preview" data-preview-for="loadout-platform-count-color"></span>
                    <span class="color-hex-value" data-hex-for="loadout-platform-count-color"></span>
                </div>
                <div class="color-option-row">
                    <label for="loadout-wez-color">Number of platforms in the WEZ / range band</label>
                    <input type="color" id="loadout-wez-color">
                    <span class="color-preview" data-preview-for="loadout-wez-color"></span>
                    <span class="color-hex-value" data-hex-for="loadout-wez-color"></span>
                </div>
                <div class="color-option-row">
                    <label for="loadout-usable-weapons-color">Quantity of usable weapons</label>
                    <input type="color" id="loadout-usable-weapons-color">
                    <span class="color-preview" data-preview-for="loadout-usable-weapons-color"></span>
                    <span class="color-hex-value" data-hex-for="loadout-usable-weapons-color"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="parent-container">
        <!-- Legend Container -->
        <div id="legend-container"></div>

        <!-- Table Container -->
        <div id="table-container"></div>
    </div>
</body>
</html>
